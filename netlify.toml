# Static site: no build step, serve the prototype folder as-is.
[build]
  publish = "prototype"
  command = ""

# Land on the audio-cue zones page. The old room-booking app lives in
# archive/room-booking/ and is not deployed.
[[redirects]]
  from = "/"
  to = "/zones.html"
  status = 200
  force = true

# Allow camera access on this origin (Netlify serves HTTPS, which getUserMedia requires).
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"
    X-Content-Type-Options = "nosniff"

# Always fetch fresh config so edits to zones.json show up on the next load.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"
