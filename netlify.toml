# Static site: no build step, serve the prototype folder as-is.
[build]
  publish = "prototype"
  command = ""

# Land on the audio-cue zones page. force = true is needed because index.html
# exists and would otherwise shadow the rule. index.html stays reachable directly.
[[redirects]]
  from = "/"
  to = "/zones.html"
  status = 200
  force = true

# Allow camera access on this origin (Netlify serves HTTPS, which getUserMedia requires).
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"
    X-Content-Type-Options = "nosniff"

# Always fetch fresh config so edits to plan.json / rooms.json show up on the next load.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "no-cache"
